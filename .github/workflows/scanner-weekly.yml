name: scanner-weekly

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional as-of date (YYYY-MM-DD); leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scanner-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run scanner weekly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          if [ -n "$AS_OF" ]; then
            uv run python -m scanner weekly --as-of "$AS_OF"
          else
            uv run python -m scanner weekly
          fi

      - name: Commit scanner state
        if: always()
        run: |
          mkdir -p scanner_state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_state
          if ! git diff --cached --quiet; then
            git commit -m "scanner: update state"
            git pull --rebase
            git push
          fi
